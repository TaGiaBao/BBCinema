# Starts MySQL and BBCinema together:
#   docker compose up -d --build
# Then open http://localhost:8080  (change the port with APP_PORT, e.g. APP_PORT=8090 in .env).
#
# Optional secrets (Gmail app password, VNPay keys, JWT_SECRET) are read from the .env file next
# to this file, if it exists. Database settings are fixed below and are not taken from .env.

# Own project name, so this local stack never reuses the containers or volumes of
# docker-compose.prod.yml (project "bbcinema"), whose MySQL has a different password.
name: bbcinema-local

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bbcinema
      TZ: Asia/Ho_Chi_Minh
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: bbcinema:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    # Values here win over the same names in .env.
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: bbcinema
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_BASE_URL: http://localhost:${APP_PORT:-8080}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      # The JRE image has no curl; bash can open a TCP connection by itself.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /login HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 10

volumes:
  mysql-data:
  uploads:

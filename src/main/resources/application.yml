# BBCinema configuration. Values written as ${NAME:default} can be overridden by environment variables.
server:
  port: ${PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: always
    # DevTools turns stack traces on in error responses; customers and API clients must never see them.
    include-stacktrace: never

spring:
  application:
    name: bbcinema
  config:
    # Reads secrets (mail password, VNPay keys...) from a .env file next to pom.xml, if it exists.
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
  # Dev, demo and tests: Hibernate creates and updates the tables. The prod profile turns this
  # off and lets Flyway apply src/main/resources/db/migration instead.
  flyway:
    enabled: false
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  # Page texts: messages.properties (Vietnamese, default) and messages_en.properties.
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  thymeleaf:
    cache: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  timezone: Asia/Ho_Chi_Minh
  seed-data: ${SEED_DATA:true}
  # Keeps a copy of every e-mail the app sends and lists them at /demo/mailbox. Demo only: never in production.
  demo-mailbox: ${DEMO_MAILBOX:false}
  booking:
    hold-minutes: 5
    cancel-before-hours: 2
    cleaning-minutes: 15
    check-in-opens-minutes-before: 60
  points:
    earn-percent: 5
    value-per-point: 1000
    max-redeem-percent: 50
  # "Đăng nhập bằng Google": leave empty to hide the button. Redirect URI: {base-url}/login/oauth2/code/google
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  # Membership tiers by spending over the last period-days; each tier gets a discount on its orders.
  membership:
    period-days: 365
    silver-from: 1000000
    gold-from: 3000000
    diamond-from: 6000000
    silver-percent: 5
    gold-percent: 10
    diamond-percent: 15
  jwt:
    # Base64 of a random 32+ byte key. Change it in production: openssl rand -base64 32
    secret: ${JWT_SECRET:Ymljb2luZW1hLWRldmVsb3BtZW50LXNlY3JldC1rZXktY2hhbmdlLW1lLTIwMjY=}
    expiration-hours: 24
    cookie-name: BB_TOKEN
  security:
    # Send the login cookie only over HTTPS. Off here so http://localhost works; the prod profile turns it on.
    cookie-secure: ${COOKIE_SECURE:false}
    # Read the client address from X-Forwarded-For. Only behind a reverse proxy that sets it; otherwise it can be faked.
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
    # Failed logins: block an email after 5 in a row, or a client address after 20 within the window, for 15 minutes.
    login:
      max-failures-per-account: 5
      max-failures-per-ip: 20
      window: 15m
      lock-duration: 15m
      max-tracked-keys: 10000
  upload:
    dir: ${UPLOAD_DIR:uploads}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:BBCinema <no-reply@bbcinema.local>}
  vnpay:
    # Register a free sandbox account at https://sandbox.vnpayment.vn/devreg/ to get these two values.
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-path: /payment/vnpay-return
  # Bank transfer by VietQR. Fill in .env: BANK_CODE (MB, VCB, ACB...), BANK_ACCOUNT_NO, BANK_ACCOUNT_NAME.
  # With SEPAY_API_TOKEN (my.sepay.vn > API Access) incoming transfers confirm bookings automatically.
  bank-qr:
    bank-code: ${BANK_CODE:}
    bank-bin: ${BANK_BIN:}
    account-no: ${BANK_ACCOUNT_NO:}
    account-name: ${BANK_ACCOUNT_NAME:}
    sepay-api-token: ${SEPAY_API_TOKEN:}
    sepay-api-url: https://userapi.sepay.vn/v2/transactions
    poll-interval-ms: 5000
    # Shows a "the bank reports the money" button on the QR page. Demo only.
    demo-confirm: ${DEMO_BANK_CONFIRM:false}

logging:
  level:
    com.bbcinema: INFO

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bbcinema}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

---
# Runs without installing MySQL: data is kept in ./data/bbcinema.mv.db
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/bbcinema;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
# Demo on a laptop: e-mails (ticket, password reset) can be read at /demo/mailbox without a real mailbox.
app:
  demo-mailbox: ${DEMO_MAILBOX:true}
  bank-qr:
    demo-confirm: ${DEMO_BANK_CONFIRM:true}

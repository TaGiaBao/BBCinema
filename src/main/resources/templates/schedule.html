<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main}, ~{::scripts})}">
<head><title>[[#{ui.lich_chieu_theo_rap_bbcinema}]]</title></head>
<body>
<main>
    <div class="page-head"><div class="container">
        <h1 class="h3 mb-1">[[#{ui.lich_chieu_theo_rap}]]</h1>
        <div class="opacity-75" th:if="${currentCinema != null}">
            <i class="bi bi-geo-alt"></i> <span th:text="${currentCinema.name} + ' · ' + ${currentCinema.address}">Rạp</span></div>
    </div></div>
    <div class="container mt-4">
        <div class="date-strip mb-4">
            <a th:each="d : ${dates}" th:href="@{/schedule(date=${d})}" th:classappend="${d == selectedDate} ? 'active'">
                <span class="day" th:text="${#temporals.format(d, 'dd')}">01</span>
                <span class="dow" th:text="${@fmt.relativeDay(d, today)} + ' · ' + ${#temporals.format(d, 'MM')}">Hôm nay</span>
                <span class="holiday-tag" th:if="${holidayDates.contains(d)}">[[#{holiday.badge}]]</span>
            </a>
        </div>
        <p class="text-muted" th:if="${#lists.isEmpty(schedule)}">[[#{ui.rap_chua_co_suat_chieu}]]</p>
        <div class="d-grid gap-3">
            <div class="panel d-flex gap-3" th:each="item : ${schedule}">
                <a th:href="@{/movies/{slug}(slug=${item.movie.slug})}" class="flex-shrink-0">
                    <img th:src="${item.movie.posterPath}" th:alt="${item.movie.title}" style="width: 110px; border-radius: 10px">
                </a>
                <div class="flex-grow-1" style="min-width: 0">
                    <a class="h5 text-decoration-none text-dark d-block" th:href="@{/movies/{slug}(slug=${item.movie.slug})}" th:text="${item.movie.title}">Phim</a>
                    <div class="small text-muted mb-3">
                        <span class="age-badge" th:classappend="${item.movie.ageRating.name()}" th:text="${item.movie.ageRating.name()}">P</span>
                        <span th:text="${item.movie.genreNames} + ' · ' + #{unit.minutesN(${item.movie.durationMinutes})}">Thể loại</span>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <a th:each="s : ${item.showtimes}" class="time-btn" th:classappend="${s.special} ? 'special'" th:href="@{/booking/showtime/{id}(id=${s.id})}">
                            <span th:text="${#temporals.format(s.startTime, 'HH:mm')}">19:00</span>
                            <small th:text="${s.versionLabel} + ' · ' + ${s.room.name}">2D</small>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

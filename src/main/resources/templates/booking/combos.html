<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main}, ~{::scripts})}">
<head><title>[[#{ui.chon_bap_nuoc_bbcinema}]]</title></head>
<body>
<main>
    <div class="container mt-4">
        <div th:replace="~{fragments/common :: steps(2)}"></div>
        <form id="comboForm" method="post" th:action="@{/booking/{code}/combos(code=${booking.code})}"
              th:attr="data-ticket-amount=${booking.ticketAmount.longValue()}">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="panel">
                        <h1 class="h5 mb-3">[[#{ui.combo_bap_nuoc}]] <span class="text-muted fw-normal small">[[#{ui.khong_bat_buoc}]]</span></h1>
                        <div class="d-grid gap-3">
                            <div class="d-flex align-items-center gap-3 border rounded-3 p-2" th:each="c : ${combos}">
                                <img th:src="${c.imagePath != null ? c.imagePath : '/images/no-image.svg'}" th:alt="${c.name}" style="width: 120px; border-radius: 10px">
                                <div class="flex-grow-1">
                                    <div class="fw-bold" th:text="${c.name}">Combo</div>
                                    <div class="small text-muted" th:text="${c.description}">Mô tả</div>
                                    <div class="fw-semibold text-primary" th:text="${@fmt.money(c.price)}">0đ</div>
                                </div>
                                <div class="input-group" style="width: 130px">
                                    <button class="btn btn-outline-secondary" type="button" data-step="-1" th:attr="data-target='combo_' + ${c.id}" th:aria-label="#{attr.bot}">−</button>
                                    <input class="form-control text-center" type="number" min="0" max="20" th:id="'combo_' + ${c.id}" th:name="'combo_' + ${c.id}"
                                           th:value="${selected.get(c.id) != null ? selected.get(c.id) : 0}" th:attr="data-price=${c.price.longValue()},aria-label=${#messages.msg('combo.qtyAria', c.name)}">
                                    <button class="btn btn-outline-secondary" type="button" data-step="1" th:attr="data-target='combo_' + ${c.id}" th:aria-label="#{attr.them}">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="summary-card p-3">
                        <div class="fw-bold mb-2" th:text="${booking.showtime.movie.title}">Phim</div>
                        <div class="summary-row"><span class="text-muted">[[#{ui.ghe}]]</span><strong th:text="${booking.seatLabels}">A1</strong></div>
                        <div class="summary-row"><span>[[#{ui.tien_ve}]]</span><span class="tabular" th:text="${@fmt.money(booking.ticketAmount)}">0đ</span></div>
                        <div class="summary-row"><span>[[#{ui.bap_nuoc}]]</span><span class="tabular" id="comboTotal">[[#{ui.0d}]]</span></div>
                        <hr>
                        <div class="summary-row align-items-center"><span class="fw-bold">[[#{ui.tam_tinh}]]</span><span class="summary-total tabular" id="grandTotal">[[#{ui.0d}]]</span></div>
                        <div class="summary-row small"><span class="text-muted">[[#{ui.thoi_gian_giu_ghe}]]</span>
                            <span class="countdown" th:attr="data-expires-at=${booking.expiresAtEpochMillis}">05:00</span></div>
                        <button class="btn btn-amber btn-lg w-100 mt-3" type="submit" data-disable-on-expire>[[#{ui.tiep_tuc}]] <i class="bi bi-arrow-right"></i></button>
                    </div>
                </div>
            </div>
        </form>
        <form class="mt-3" method="post" th:action="@{/booking/{code}/cancel(code=${booking.code})}">
            <button class="btn btn-link text-danger px-0" type="submit"><i class="bi bi-x-circle"></i> [[#{ui.huy_va_chon_lai_ghe}]]</button>
        </form>
    </div>
</main>
<th:block th:fragment="scripts"><script src="/js/combos.js"></script><script src="/js/countdown.js"></script></th:block>
</body>
</html>

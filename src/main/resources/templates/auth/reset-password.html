<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main}, ~{::scripts})}">
<head><title>Đặt lại mật khẩu · BBCinema</title></head>
<body>
<main>
    <div class="container py-5" style="max-width: 460px">
        <div class="panel p-4">
            <h1 class="h3 mb-1">Đặt mật khẩu mới</h1>
            <div class="alert alert-danger" th:if="${error != null}" th:text="${error}">Lỗi</div>
            <th:block th:if="${valid}">
                <p class="text-muted mb-4">Chọn mật khẩu mới cho tài khoản của bạn.</p>
                <form th:action="@{/reset-password}" method="post" class="d-grid gap-3">
                    <input type="hidden" name="token" th:value="${token}">
                    <div>
                        <label class="form-label" for="password">Mật khẩu mới</label>
                        <input class="form-control" id="password" name="password" type="password" minlength="6" maxlength="64" required autofocus autocomplete="new-password">
                    </div>
                    <div>
                        <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới</label>
                        <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" minlength="6" maxlength="64" required autocomplete="new-password">
                    </div>
                    <button class="btn btn-amber btn-lg" type="submit">Lưu mật khẩu mới</button>
                </form>
            </th:block>
            <div th:unless="${valid}" class="alert alert-warning mb-0">
                Đường dẫn đặt lại mật khẩu không hợp lệ hoặc đã hết hạn. <a href="/forgot-password">Yêu cầu đường dẫn mới</a>.
            </div>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

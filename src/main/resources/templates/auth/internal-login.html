<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Đăng nhập nội bộ · BBCinema</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="internal-login">
<main class="container py-5" style="max-width: 440px">
    <div class="text-center mb-4">
        <span class="bb-logo justify-content-center"><span class="mark">BB</span><span class="word">BB<span>Cinema</span></span></span>
        <div class="internal-badge mt-2"><i class="bi bi-shield-lock"></i> Hệ thống nội bộ</div>
    </div>
    <div class="panel p-4">
        <h1 class="h4 mb-1">Đăng nhập nội bộ</h1>
        <p class="text-muted small mb-4">Dành cho nhân viên quầy vé và quản trị viên.</p>
        <div class="alert alert-danger" th:if="${error != null}" th:text="${error}">Lỗi</div>
        <div class="alert alert-info small" th:if="${param.logout != null}">Bạn đã đăng xuất.</div>
        <form th:action="@{/internal/login}" method="post" class="d-grid gap-3">
            <input type="hidden" name="redirect" th:value="${redirect}">
            <div>
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" name="email" type="email" required autofocus th:value="${email}" autocomplete="username">
            </div>
            <div>
                <label class="form-label" for="password">Mật khẩu</label>
                <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
                <div class="text-end small mt-1"><a href="/forgot-password">Quên mật khẩu?</a></div>
            </div>
            <button class="btn btn-navy btn-lg" type="submit">Đăng nhập</button>
        </form>
    </div>
    <div class="panel p-3 mt-3 small">
        <div class="fw-bold mb-1">Tài khoản dùng thử</div>
        <div>Nhân viên: <code>staff@bbcinema.vn</code> / <code>Staff@123</code></div>
        <div>Quản trị: <code>admin@bbcinema.vn</code> / <code>Admin@123</code></div>
    </div>
</main>
</body>
</html>

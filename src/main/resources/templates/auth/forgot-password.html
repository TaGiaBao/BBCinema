<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main}, ~{::scripts})}">
<head><title>[[#{ui.quen_mat_khau_bbcinema}]]</title></head>
<body>
<main>
    <div class="container py-5" style="max-width: 460px">
        <div class="panel p-4">
            <h1 class="h3 mb-1">[[#{ui.quen_mat_khau_2}]]</h1>
            <th:block th:unless="${sent}">
                <p class="text-muted mb-4">[[#{ui.nhap_email_da_dang_ky}]]</p>
                <form th:action="@{/forgot-password}" method="post" class="d-grid gap-3">
                    <div>
                        <label class="form-label" for="email">[[#{page.member_profile.email}]]</label>
                        <input class="form-control" id="email" name="email" type="email" required autofocus autocomplete="email">
                    </div>
                    <button class="btn btn-amber btn-lg" type="submit">[[#{ui.gui_duong_dan}]]</button>
                </form>
            </th:block>
            <div th:if="${sent}" class="alert alert-success mb-0" role="status">
                [[#{ui.neu}]] <strong th:text="${email}">email</strong> [[#{ui.da_dang_ky_tai_khoan}]]
            </div>
            <p class="mt-3 mb-0 text-center small"><a href="/login">[[#{ui.quay_lai_dang_nhap}]]</a></p>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

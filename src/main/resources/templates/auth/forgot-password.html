<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main}, ~{::scripts})}">
<head><title>Quên mật khẩu · BBCinema</title></head>
<body>
<main>
    <div class="container py-5" style="max-width: 460px">
        <div class="panel p-4">
            <h1 class="h3 mb-1">Quên mật khẩu</h1>
            <th:block th:unless="${sent}">
                <p class="text-muted mb-4">Nhập email đã đăng ký. Chúng tôi sẽ gửi đường dẫn để bạn đặt mật khẩu mới.</p>
                <form th:action="@{/forgot-password}" method="post" class="d-grid gap-3">
                    <div>
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" id="email" name="email" type="email" required autofocus autocomplete="email">
                    </div>
                    <button class="btn btn-amber btn-lg" type="submit">Gửi đường dẫn</button>
                </form>
            </th:block>
            <div th:if="${sent}" class="alert alert-success mb-0" role="status">
                Nếu <strong th:text="${email}">email</strong> đã đăng ký tài khoản BBCinema, bạn sẽ nhận được email có đường dẫn
                đặt lại mật khẩu trong vài phút. Đường dẫn hết hạn sau 30 phút. Hãy xem cả thư mục Spam.
            </div>
            <p class="mt-3 mb-0 text-center small"><a href="/login">Quay lại đăng nhập</a></p>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

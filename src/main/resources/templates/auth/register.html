<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main}, ~{::scripts})}">
<head><title>[[#{ui.dang_ky_bbcinema}]]</title></head>
<body>
<main>
    <div class="container py-5" style="max-width: 560px">
        <div class="panel p-4">
            <h1 class="h3 mb-1">[[#{ui.dang_ky_thanh_vien}]]</h1>
            <p class="text-muted mb-4">[[#{ui.thanh_vien_duoc_tich_5}]]</p>
            <form th:action="@{/register}" th:object="${form}" method="post" class="row g-3" novalidate>
                <div class="col-12 alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:text="${#fields.globalErrors()[0]}">Lỗi</div>
                <div class="col-12">
                    <label class="form-label" for="fullName">[[#{ui.ho_va_ten}]]</label>
                    <input class="form-control" id="fullName" th:field="*{fullName}" th:errorclass="is-invalid" autocomplete="name">
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="email">[[#{page.member_profile.email}]]</label>
                    <input class="form-control" id="email" type="email" th:field="*{email}" th:errorclass="is-invalid" autocomplete="email">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="phone">[[#{ui.so_dien_thoai}]]</label>
                    <input class="form-control" id="phone" th:field="*{phone}" th:errorclass="is-invalid" autocomplete="tel">
                    <div class="invalid-feedback" th:errors="*{phone}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="birthDate">[[#{ui.ngay_sinh}]]</label>
                    <input class="form-control" id="birthDate" type="date" th:field="*{birthDate}" th:errorclass="is-invalid">
                    <div class="form-text">[[#{ui.dung_de_kiem_tra_do}]]</div>
                    <div class="invalid-feedback" th:errors="*{birthDate}"></div>
                </div>
                <div class="col-md-6"></div>
                <div class="col-md-6">
                    <label class="form-label" for="password">[[#{ui.mat_khau}]]</label>
                    <input class="form-control" id="password" type="password" th:field="*{password}" th:errorclass="is-invalid" autocomplete="new-password">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="confirmPassword">[[#{ui.nhap_lai_mat_khau}]]</label>
                    <input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}" th:errorclass="is-invalid" autocomplete="new-password">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
                <div class="col-12 d-grid"><button class="btn btn-amber btn-lg" type="submit">[[#{ui.tao_tai_khoan}]]</button></div>
            </form>
            <p class="mt-3 mb-0 text-center small">[[#{ui.da_co_tai_khoan}]] <a href="/login">[[#{ui.dang_nhap}]]</a></p>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

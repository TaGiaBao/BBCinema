<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main}, ~{::scripts})}">
<head><title>[[#{verify.title}]] · BBCinema</title></head>
<body>
<main>
    <!-- After sign-up: the account works once the member opens the link mailed to them. -->
    <div class="container py-5" style="max-width: 520px">
        <div class="panel p-4 text-center">
            <div class="display-5 text-warning mb-2"><i class="bi bi-envelope-check"></i></div>
            <h1 class="h3 mb-2">[[#{verify.title}]]</h1>
            <p class="text-muted" th:if="${email != null}">[[#{verify.sentTo}]] <strong th:text="${email}">email</strong>.</p>
            <p class="text-muted">[[#{verify.howto}]]</p>
            <div class="alert alert-success small" th:if="${resent}" role="status">[[#{verify.resent}]]</div>
            <form th:action="@{/verify-email/resend}" method="post" class="d-flex gap-2 mt-3">
                <input class="form-control" name="email" type="email" required th:value="${email}"
                       th:aria-label="#{page.member_profile.email}" autocomplete="email">
                <button class="btn btn-outline-navy text-nowrap" type="submit">[[#{verify.resend}]]</button>
            </form>
            <p class="small text-muted mt-3 mb-0">[[#{verify.spam}]]</p>
            <p class="mt-3 mb-0 small"><a href="/login">[[#{ui.quay_lai_dang_nhap}]]</a></p>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

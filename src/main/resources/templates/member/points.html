<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main}, ~{::scripts})}">
<head><title>[[#{ui.diem_thuong_bbcinema}]]</title></head>
<body>
<main>
    <div class="page-head"><div class="container"><h1 class="h3 mb-0">[[#{ui.thanh_vien}]]</h1></div></div>
    <div class="container mt-4">
        <div class="row g-4">
            <div class="col-lg-3"><div th:replace="~{member/_nav :: nav}"></div></div>
            <div class="col-lg-9">
                <div class="panel">
                    <h2 class="h5 mb-1">[[#{ui.diem_thuong}]]</h2>
                    <p class="small text-muted">[[#{ui.moi_don_thanh_toan_duoc}]]</p>
                    <p class="text-muted" th:if="${#lists.isEmpty(transactions)}">[[#{ui.chua_co_giao_dich_diem}]]</p>
                    <div class="table-responsive" th:unless="${#lists.isEmpty(transactions)}">
                        <table class="table align-middle">
                            <thead><tr><th>[[#{ui.thoi_gian}]]</th><th>[[#{ui.loai}]]</th><th>[[#{ui.noi_dung}]]</th><th class="text-end">[[#{ui.diem}]]</th></tr></thead>
                            <tbody>
                            <tr th:each="t : ${transactions}">
                                <td class="small" th:text="${#temporals.format(t.createdAt, 'HH:mm dd/MM/yyyy')}">-</td>
                                <td th:text="${t.type.label}">Tích điểm</td>
                                <td class="small" th:text="${t.note}">-</td>
                                <td class="text-end fw-bold tabular" th:classappend="${t.points > 0} ? 'text-success' : 'text-danger'"
                                    th:text="${t.points > 0 ? '+' + t.points : t.points}">+10</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

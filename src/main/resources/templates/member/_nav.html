<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="nav" class="d-grid gap-3">
    <div class="points-card p-3">
        <div class="small opacity-75">Xin chào</div>
        <div class="fw-bold fs-5" th:text="${user.fullName}">Tên</div>
        <div class="small opacity-75 mt-2">Điểm thưởng hiện có</div>
        <div class="value tabular" th:text="${user.points}">0</div>
        <div class="small opacity-75" th:text="'Tương đương ' + ${@fmt.money(user.points * 1000)}">0đ</div>
    </div>
    <div class="list-group member-nav">
        <a class="list-group-item list-group-item-action" th:classappend="${tab == 'profile'} ? 'active'" href="/member"><i class="bi bi-person"></i> Thông tin tài khoản</a>
        <a class="list-group-item list-group-item-action" th:classappend="${tab == 'bookings'} ? 'active'" href="/member/bookings"><i class="bi bi-ticket-perforated"></i> Lịch sử giao dịch</a>
        <a class="list-group-item list-group-item-action" th:classappend="${tab == 'points'} ? 'active'" href="/member/points"><i class="bi bi-star"></i> Điểm thưởng</a>
    </div>
</div>
</body>
</html>

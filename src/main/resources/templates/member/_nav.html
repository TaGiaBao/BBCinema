<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="nav" class="d-grid gap-3">
    <div class="points-card p-3">
        <div class="small opacity-75">[[#{ui.xin_chao}]]</div>
        <div class="fw-bold fs-5" th:text="${user.fullName}">Tên</div>
        <div class="small opacity-75 mt-2">[[#{ui.diem_thuong_hien_co}]]</div>
        <div class="value tabular" th:text="${user.points}">0</div>
        <div class="small opacity-75" th:text="#{member.pointsWorth(${@fmt.money(user.points * 1000)})}">0đ</div>
    </div>
    <div class="list-group member-nav">
        <a class="list-group-item list-group-item-action" th:classappend="${tab == 'profile'} ? 'active'" href="/member"><i class="bi bi-person"></i> [[#{ui.thong_tin_tai_khoan}]]</a>
        <a class="list-group-item list-group-item-action" th:classappend="${tab == 'bookings'} ? 'active'" href="/member/bookings"><i class="bi bi-ticket-perforated"></i> [[#{ui.lich_su_giao_dich}]]</a>
        <a class="list-group-item list-group-item-action" th:classappend="${tab == 'points'} ? 'active'" href="/member/points"><i class="bi bi-star"></i> [[#{ui.diem_thuong}]]</a>
    </div>
</div>
</body>
</html>

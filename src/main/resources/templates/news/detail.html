<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main}, ~{::scripts})}">
<head><title th:text="${post.title} + ' · BBCinema'">Bài viết</title></head>
<body>
<main>
    <div class="container mt-4">
        <div class="row g-5">
            <article class="col-lg-8">
                <span class="badge text-bg-warning" th:text="${post.type.label}">Ưu đãi</span>
                <h1 class="h2 mt-2" th:text="${post.title}">Tiêu đề</h1>
                <p class="text-muted small" th:text="${#temporals.format(post.publishedAt, 'dd/MM/yyyy')}">01/01/2026</p>
                <img class="img-fluid rounded mb-4" th:if="${post.thumbnailPath != null}" th:src="${post.thumbnailPath}" th:alt="${post.title}">
                <p class="lead" th:text="${post.summary}">Tóm tắt</p>
                <div style="white-space: pre-line; max-width: 70ch" th:text="${post.content}">Nội dung</div>
            </article>
            <aside class="col-lg-4">
                <h2 class="h5 mb-3">[[#{ui.bai_viet_khac}]]</h2>
                <div class="d-grid gap-3">
                    <a th:each="p : ${latest}" th:if="${p.id != post.id}" class="d-flex gap-3 text-decoration-none text-dark" th:href="@{/news/{slug}(slug=${p.slug})}">
                        <img th:src="${p.thumbnailPath != null ? p.thumbnailPath : '/images/no-image.svg'}" alt="" style="width: 120px; border-radius: 8px">
                        <span class="fw-semibold small" th:text="${p.title}">Tiêu đề</span>
                    </a>
                </div>
            </aside>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

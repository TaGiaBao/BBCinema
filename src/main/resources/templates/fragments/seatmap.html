<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Seat map used by the customer booking page and the counter sale page.
     Each free seat is a button; a hidden checkbox with the same id is what the form submits.
     seat-map.js polls the seat API and marks seats that other people hold or buy. -->
<div th:fragment="seatMap(seatMap, inputName)" class="seat-map-live" th:attr="data-showtime-id=${seatMap.showtimeId}">
    <div class="alert alert-warning small d-none" data-role="seat-notice" role="alert"></div>
    <div class="screen"></div>
    <div class="screen-label">[[#{ui.man_hinh}]]</div>
    <div class="seat-map-wrap">
        <div class="seat-map" th:style="'--seat-cols:' + ${seatMap.columns}">
            <div class="seat-row" th:each="row : ${seatMap.rows}" th:classappend="${#lists.isEmpty(row.cells)} ? 'walkway'">
                <span class="row-label" th:text="${row.label}">A</span>
                <div class="seat-line">
                <th:block th:each="cell : ${row.cells}">
                    <button type="button" class="seat"
                            th:style="'grid-column:' + ${cell.x + 1} + ' / span ' + ${cell.width}"
                            th:classappend="${cell.type.name()} + ' ' + (${cell.available} ? '' : 'taken') + ' ' + (${cell.status != null and cell.status.name() == 'HELD'} ? 'held' : '')"
                            th:attr="data-id=${cell.showtimeSeatId},data-label=${cell.label},data-type=${cell.type.name()},data-price=${cell.price.longValue()},aria-pressed='false',aria-label=${#messages.msg('seat.aria', cell.label, cell.type.label, cell.available ? @fmt.money(cell.price) : (cell.status.name() == 'HELD' ? #messages.msg('seat.held') : #messages.msg('seat.sold')))},title=${cell.label + ' · ' + cell.type.label + ' · ' + @fmt.money(cell.price)}"
                            th:disabled="${!cell.available}"><span class="num" th:text="${cell.number}">1</span></button>
                    <input type="checkbox" class="d-none" th:name="${inputName}" th:value="${cell.showtimeSeatId}" th:disabled="${!cell.available}">
                </th:block>
                </div>
                <span class="row-label" th:text="${row.label}">A</span>
            </div>
        </div>
    </div>
    <div class="seat-legend mt-3">
        <span><span class="seat STANDARD"></span>[[#{ui.ghe_thuong}]]</span>
        <span><span class="seat VIP"></span>[[#{ui.ghe_vip}]]</span>
        <span><span class="seat COUPLE"></span>[[#{ui.ghe_doi}]]</span>
        <span><span class="seat selected"></span>[[#{ui.dang_chon}]]</span>
        <span><span class="seat taken held"></span>[[#{ui.dang_co_nguoi_giu}]]</span>
        <span><span class="seat taken"></span>[[#{ui.da_ban}]]</span>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::section}, ~{::scripts})}">
<head><title>Tài khoản · Quản trị BBCinema</title></head>
<body>
<section class="p-4">
    <h1 class="h4 mb-3">Tài khoản</h1>
    <!-- Only the general manager gives out internal accounts; members sign up on the website. -->
    <form class="panel mb-3" method="post" th:action="@{/admin/users/new}" autocomplete="off">
        <h2 class="h6">Cấp tài khoản nội bộ</h2>
        <div class="row g-2 align-items-end">
            <div class="col-md-3"><label class="form-label small" for="newName">Họ tên</label>
                <input class="form-control" id="newName" name="fullName" required maxlength="100"></div>
            <div class="col-md-3"><label class="form-label small" for="newEmail">Email</label>
                <input class="form-control" id="newEmail" name="email" type="email" required autocomplete="off"></div>
            <div class="col-md-2"><label class="form-label small" for="newPassword">Mật khẩu (≥ 8 ký tự)</label>
                <input class="form-control" id="newPassword" name="password" type="password" minlength="8" required autocomplete="new-password"></div>
            <div class="col-md-2"><label class="form-label small" for="newRole">Vai trò</label>
                <select class="form-select" id="newRole" name="role">
                    <option th:each="r : ${internalRoles}" th:value="${r}" th:text="${r.label}">-</option></select></div>
            <div class="col-md-2"><label class="form-label small" for="newCinema">Rạp</label>
                <select class="form-select" id="newCinema" name="cinemaId">
                    <option value="">— Không —</option>
                    <option th:each="c : ${allCinemas}" th:value="${c.id}" th:text="${c.name}">Rạp</option></select></div>
            <div class="col-12"><span class="small text-muted">Quản lý quầy bắt buộc chọn rạp. Quản lý tổng không gắn rạp.</span>
                <button class="btn btn-navy btn-sm float-end" type="submit"><i class="bi bi-person-plus"></i> Cấp tài khoản</button></div>
        </div>
    </form>
    <div class="panel">
        <form class="row g-2 mb-3" method="get">
            <div class="col-md-6"><input class="form-control" name="q" th:value="${q}" placeholder="Tìm email hoặc tên" aria-label="Tìm tài khoản"></div>
            <div class="col-md-4"><select class="form-select" name="role" aria-label="Vai trò"><option value="">Mọi vai trò</option>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}" th:selected="${r == role}">-</option></select></div>
            <div class="col-md-2 d-grid"><button class="btn btn-navy" type="submit">Lọc</button></div>
        </form>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead><tr><th>Họ tên</th><th>Email</th><th>Điện thoại</th><th class="text-end">Điểm</th><th>Ngày tạo</th><th style="width: 480px">Vai trò · Rạp · Trạng thái</th></tr></thead>
                <tbody><tr th:each="u : ${page.content}">
                    <td class="fw-semibold" th:text="${u.fullName}">Tên</td>
                    <td class="small" th:text="${u.email}">email</td>
                    <td class="small" th:text="${u.phone}">-</td>
                    <td class="text-end tabular" th:text="${u.points}">0</td>
                    <td class="small" th:text="${#temporals.format(u.createdAt, 'dd/MM/yyyy')}">-</td>
                    <td>
                        <form class="d-flex gap-2 align-items-center" method="post" th:action="@{/admin/users/{id}(id=${u.id})}">
                            <select class="form-select form-select-sm" name="role" aria-label="Vai trò">
                                <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}" th:selected="${r == u.role}">-</option></select>
                            <select class="form-select form-select-sm" name="cinemaId" aria-label="Rạp">
                                <option value="">— Không gắn rạp —</option>
                                <option th:each="c : ${allCinemas}" th:value="${c.id}" th:text="${c.name}"
                                        th:selected="${u.cinema != null and u.cinema.id == c.id}">Rạp</option></select>
                            <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" name="enabled" value="true" th:checked="${u.enabled}" th:id="'en' + ${u.id}">
                                <label class="form-check-label small" th:for="'en' + ${u.id}">Mở</label></div>
                            <button class="btn btn-sm btn-outline-navy" type="submit">Lưu</button>
                        </form>
                    </td>
                </tr></tbody>
            </table>
        </div>
        <div th:replace="~{fragments/common :: pager(${page}, ${'/admin/users?q=' + (q != null ? q : '') + '&role=' + (role != null ? role : '')})}"></div>
    </div>
</section>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

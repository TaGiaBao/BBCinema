<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::section}, ~{::scripts})}">
<head><title>Bảng giá vé · Quản trị BBCinema</title></head>
<body>
<section class="p-4" style="max-width: 1100px">
    <h1 class="h4">Bảng giá vé</h1>
    <p class="text-muted small">Giá mới chỉ áp dụng cho suất chiếu tạo sau khi lưu. Vé đã tạo giữ nguyên giá cũ.</p>
    <form method="post" th:action="@{/admin/prices}" class="panel">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead><tr><th>Định dạng</th><th>Ngày</th><th>Khung giờ</th><th>Loại ghế</th><th style="width: 200px">Giá (đ)</th></tr></thead>
                <tbody><tr th:each="p : ${prices}">
                    <td th:text="${p.format.label}">2D</td>
                    <td th:text="${p.dayType.label}">T2-T6</td>
                    <td th:text="${p.timeSlot.label}">Trước 17h</td>
                    <td th:text="${p.seatType.label}">Thường</td>
                    <td><input class="form-control form-control-sm text-end" type="number" min="0" step="1000" th:name="'price_' + ${p.id}" th:value="${p.price.longValue()}"
                               th:attr="aria-label=${p.format.label + ' ' + p.dayType.label + ' ' + p.timeSlot.label + ' ' + p.seatType.label}"></td>
                </tr></tbody>
            </table>
        </div>
        <button class="btn btn-amber" type="submit">Lưu bảng giá</button>
    </form>
</section>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

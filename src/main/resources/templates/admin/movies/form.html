<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::section}, ~{::scripts})}">
<head><title>Phim · Quản trị BBCinema</title></head>
<body>
<section class="p-4" style="max-width: 1000px">
    <a href="/admin/movies" class="small"><i class="bi bi-arrow-left"></i> Danh sách phim</a>
    <h1 class="h4 mt-2" th:text="${form.id == null ? 'Thêm phim' : 'Sửa phim'}">Phim</h1>
    <form class="panel row g-3" method="post" th:action="@{/admin/movies/save}" enctype="multipart/form-data" th:object="${form}">
        <input type="hidden" th:field="*{id}">
        <div class="col-12 alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:text="${#fields.globalErrors()[0]}">Lỗi</div>
        <div class="col-md-8">
            <label class="form-label" for="title">Tên phim</label>
            <input class="form-control" id="title" th:field="*{title}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>
        <div class="col-md-4">
            <label class="form-label" for="status">Trạng thái</label>
            <select class="form-select" id="status" th:field="*{status}">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}">-</option></select>
        </div>
        <div class="col-md-6"><label class="form-label" for="director">Đạo diễn</label><input class="form-control" id="director" th:field="*{director}"></div>
        <div class="col-md-6"><label class="form-label" for="actors">Diễn viên</label><input class="form-control" id="actors" th:field="*{actors}"></div>
        <div class="col-md-3">
            <label class="form-label" for="durationMinutes">Thời lượng (phút)</label>
            <input class="form-control" id="durationMinutes" type="number" th:field="*{durationMinutes}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{durationMinutes}"></div>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="ageRating">Phân loại</label>
            <select class="form-select" id="ageRating" th:field="*{ageRating}">
                <option th:each="r : ${ratings}" th:value="${r}" th:text="${r.name()} + ' - ' + ${r.label}">-</option></select>
        </div>
        <div class="col-md-3"><label class="form-label" for="releaseDate">Khởi chiếu</label><input class="form-control" id="releaseDate" type="date" th:field="*{releaseDate}"></div>
        <div class="col-md-3"><label class="form-label" for="language">Ngôn ngữ</label><input class="form-control" id="language" th:field="*{language}"></div>
        <div class="col-12">
            <label class="form-label" for="trailerUrl">Link trailer YouTube</label>
            <input class="form-control" id="trailerUrl" th:field="*{trailerUrl}" th:errorclass="is-invalid" placeholder="https://www.youtube.com/watch?v=...">
            <div class="invalid-feedback" th:errors="*{trailerUrl}"></div>
        </div>
        <div class="col-12">
            <label class="form-label" for="description">Nội dung phim</label>
            <textarea class="form-control" id="description" rows="4" th:field="*{description}" th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>
        <div class="col-12">
            <span class="form-label d-block">Thể loại</span>
            <div class="d-flex flex-wrap gap-3">
                <div class="form-check" th:each="g : ${genres}">
                    <input class="form-check-input" type="checkbox" th:field="*{genreIds}" th:value="${g.id}">
                    <label class="form-check-label" th:for="${#ids.prev('genreIds')}" th:text="${g.name}">Thể loại</label>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <label class="form-label" for="poster">Poster (JPG, PNG, tối đa 5MB)</label>
            <input class="form-control" id="poster" type="file" name="poster" accept="image/*">
            <input type="hidden" th:field="*{posterPath}">
        </div>
        <div class="col-md-4" th:if="*{posterPath != null}"><img th:src="*{posterPath}" alt="Poster hiện tại" style="max-height: 150px; border-radius: 8px"></div>
        <div class="col-12"><button class="btn btn-amber" type="submit">Lưu phim</button></div>
    </form>
</section>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

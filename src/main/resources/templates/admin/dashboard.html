<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::section}, ~{::scripts})}">
<head><title>Thống kê · Quản trị BBCinema</title></head>
<body>
<section class="p-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <h1 class="h4 mb-0">Thống kê doanh thu</h1>
        <form class="d-flex gap-2 align-items-end" method="get">
            <div><label class="form-label small mb-0" for="from">Từ ngày</label><input class="form-control form-control-sm" type="date" id="from" name="from" th:value="${from}"></div>
            <div><label class="form-label small mb-0" for="to">Đến ngày</label><input class="form-control form-control-sm" type="date" id="to" name="to" th:value="${to}"></div>
            <button class="btn btn-sm btn-navy" type="submit">Xem</button>
        </form>
    </div>
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3"><div class="stat-card"><div class="label">Doanh thu hôm nay</div><div class="value tabular" th:text="${@fmt.money(stats.revenueToday)}">0đ</div><div class="small text-muted" th:text="${stats.bookingsToday} + ' đơn'">0 đơn</div></div></div>
        <div class="col-6 col-lg-3"><div class="stat-card"><div class="label">Doanh thu tháng này</div><div class="value tabular" th:text="${@fmt.money(stats.revenueThisMonth)}">0đ</div><div class="small text-muted" th:text="${stats.bookingsThisMonth} + ' đơn'">0 đơn</div></div></div>
        <div class="col-6 col-lg-3"><div class="stat-card"><div class="label">Thành viên</div><div class="value tabular" th:text="${stats.members}">0</div></div></div>
        <div class="col-6 col-lg-3"><div class="stat-card"><div class="label">Phim đang chiếu</div><div class="value tabular" th:text="${stats.moviesShowing}">0</div></div></div>
    </div>
    <div class="row g-4">
        <div class="col-xl-8">
            <div class="panel">
                <h2 class="h6">Doanh thu theo ngày</h2>
                <div style="position: relative; height: 320px"><canvas id="dailyChart" aria-label="Biểu đồ doanh thu theo ngày" role="img"></canvas></div>
            </div>
        </div>
        <div class="col-xl-4">
            <div class="panel">
                <h2 class="h6">Doanh thu theo phim</h2>
                <p class="text-muted small" th:if="${#lists.isEmpty(byMovie)}">Chưa có doanh thu trong khoảng này.</p>
                <table class="table table-sm align-middle mb-0" th:unless="${#lists.isEmpty(byMovie)}">
                    <thead><tr><th>Phim</th><th class="text-end">Vé</th><th class="text-end">Doanh thu</th></tr></thead>
                    <tbody><tr th:each="m : ${byMovie}">
                        <td class="small" th:text="${m.movieTitle}">Phim</td>
                        <td class="text-end tabular" th:text="${m.tickets}">0</td>
                        <td class="text-end tabular fw-semibold" th:text="${@fmt.money(m.revenue)}">0đ</td>
                    </tr></tbody>
                </table>
            </div>
        </div>
    </div>
</section>
<th:block th:fragment="scripts">
    <script src="/webjars/chart.js/4.4.1/dist/chart.umd.js"></script>
    <script th:inline="javascript">
        (function () {
            const labels = /*[[${chartLabels}]]*/ [];
            const revenues = /*[[${chartRevenues}]]*/ [];
            const counts = /*[[${chartCounts}]]*/ [];
            new Chart(document.getElementById('dailyChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Doanh thu (đ)', data: revenues, backgroundColor: '#ffb400', borderRadius: 6, maxBarThickness: 36 }]
                },
                options: {
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false },
                        tooltip: { callbacks: { label: (c) => Number(c.raw).toLocaleString('vi-VN') + 'đ · ' + counts[c.dataIndex] + ' đơn' } } },
                    scales: { y: { beginAtZero: true, ticks: { callback: (v) => (v / 1000).toLocaleString('vi-VN') + 'k' }, grid: { color: '#eef0f6' } },
                              x: { grid: { display: false } } }
                }
            });
        })();
    </script>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main}, ~{::scripts})}">
<head><title>[[#{ui.gia_ve_bbcinema}]]</title></head>
<body>
<main>
    <div class="page-head"><div class="container"><h1 class="h3 mb-0">[[#{ui.gia_ve}]]</h1></div></div>
    <div class="container mt-4">
        <p class="text-muted">[[#{ui.gia_ap_dung_cho_mot}]]</p>
        <div class="row g-4">
            <div class="col-lg-6" th:each="format : ${formats}">
                <div class="panel">
                    <h2 class="h5 mb-3" th:text="'Phim ' + ${format.label}">2D</h2>
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead><tr><th>[[#{ui.ngay}]]</th><th>[[#{ui.khung_gio}]]</th>
                                <th class="text-end" th:each="t : ${seatTypes}" th:text="${t.label}">Ghế</th></tr></thead>
                            <tbody>
                            <th:block th:each="day : ${dayTypes}">
                                <tr th:each="slot : ${timeSlots}">
                                    <td th:text="${day.label}">T2</td>
                                    <td th:text="${slot.label}">Trước 17h</td>
                                    <td class="text-end tabular fw-semibold" th:each="t : ${seatTypes}">
                                        <th:block th:each="p : ${prices}" th:if="${p.format == format and p.dayType == day and p.timeSlot == slot and p.seatType == t}"
                                                  th:text="${@fmt.money(p.price)}">0đ</th:block>
                                    </td>
                                </tr>
                            </th:block>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <p class="text-muted small mt-3 mb-0" data-role="holiday-note">[[#{holiday.priceNote}]]</p>
        <div class="panel mt-4" data-role="upcoming-holidays">
            <h2 class="h5 mb-3">[[#{holiday.upcomingTitle}]]</h2>
            <p class="text-muted mb-0" th:if="${#lists.isEmpty(holidays)}">[[#{holiday.none}]]</p>
            <ul class="list-unstyled mb-0" th:unless="${#lists.isEmpty(holidays)}">
                <li class="py-1" th:each="h : ${holidays}">
                    <span class="fw-semibold tabular" th:text="${#temporals.format(h.date, 'dd/MM/yyyy')}">01/01/2027</span>
                    <span class="text-muted" th:text="'(' + ${@fmt.dayName(h.date)} + ')'">(Thứ 6)</span>
                    · <span th:text="${h.name}">Tết Dương lịch</span>
                </li>
            </ul>
        </div>
        <h2 class="h4 mt-5 mb-3">[[#{ui.combo_bap_nuoc}]]</h2>
        <div class="row row-cols-2 row-cols-md-4 g-4">
            <div class="col" th:each="c : ${combos}">
                <div class="panel h-100 text-center">
                    <img th:src="${c.imagePath != null ? c.imagePath : '/images/no-image.svg'}" th:alt="${c.name}" class="img-fluid mb-2 rounded">
                    <div class="fw-bold" th:text="${c.name}">Combo</div>
                    <div class="small text-muted" th:text="${c.description}">Mô tả</div>
                    <div class="fw-bold text-primary mt-1" th:text="${@fmt.money(c.price)}">0đ</div>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

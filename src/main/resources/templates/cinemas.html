<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main}, ~{::scripts})}">
<head><title>[[#{ui.he_thong_rap_bbcinema}]]</title></head>
<body>
<main>
    <div class="page-head"><div class="container"><h1 class="h3 mb-0">[[#{ui.he_thong_rap_bbcinema_2}]]</h1></div></div>
    <div class="container mt-4">
        <div class="row g-4">
            <div class="col-lg-5 d-grid gap-3 align-content-start" id="cinemaList">
                <div class="panel cinema-card" th:each="c : ${cinemas}"
                     th:attr="data-cinema-id=${c.id},data-lat=${c.latitude},data-lng=${c.longitude},data-name=${c.name},data-address=${c.address}">
                    <h2 class="h5"><i class="bi bi-building text-warning"></i> <span th:text="${c.name}">Rạp</span></h2>
                    <p class="mb-1"><i class="bi bi-geo-alt"></i> <span th:text="${c.address}">Địa chỉ</span></p>
                    <p class="mb-3"><i class="bi bi-telephone"></i> <span th:text="${c.phone}">SĐT</span></p>
                    <div class="d-flex flex-wrap gap-2">
                        <a class="btn btn-navy btn-sm" th:href="@{/select-cinema(id=${c.id},redirect='/schedule')}">[[#{ui.xem_lich_chieu}]]</a>
                        <button type="button" class="btn btn-outline-navy btn-sm" data-role="show-on-map" th:if="${c.hasLocation()}">
                            <i class="bi bi-map"></i> [[#{ui.xem_tren_ban_do}]]</button>
                        <a class="btn btn-link btn-sm" target="_blank" rel="noopener" th:if="${c.hasLocation()}"
                           th:href="'https://www.google.com/maps/dir/?api=1&destination=' + ${c.latitude} + ',' + ${c.longitude}">
                            <i class="bi bi-sign-turn-right"></i> [[#{ui.chi_duong}]]</a>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="panel p-2">
                    <h2 class="h6 px-2 pt-1">[[#{ui.ban_do_vi_tri}]]</h2>
                    <div id="cinemaMap" class="cinema-map" role="region" th:aria-label="#{attr.ban_do_cac_rap_bbcinema}"></div>
                    <p class="small text-muted px-2 mb-1 mt-2">[[#{ui.ban_do_openstreetmap_can_ket}]]</p>
                </div>
            </div>
        </div>
    </div>
</main>
<th:block th:fragment="scripts">
    <link rel="stylesheet" href="/webjars/leaflet/1.9.4/dist/leaflet.css">
    <script src="/webjars/leaflet/1.9.4/dist/leaflet.js"></script>
    <script src="/js/cinema-map.js"></script>
</th:block>
</body>
</html>

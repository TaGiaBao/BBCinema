<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!-- Fallback for every error without its own page (405, 400, ...). Never shows technical details. -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>[[#{error.title}]] · BBCinema</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="container py-5 text-center" style="max-width: 640px">
    <a class="bb-logo justify-content-center mb-4" href="/"><span class="mark">BB</span></a>
    <div class="display-3 fw-bold text-warning" th:text="${status}">400</div>
    <h1 class="h4 mt-2">[[#{error.title}]]</h1>
    <p class="text-muted">[[#{error.generic}]]</p>
    <a class="btn btn-outline-secondary mt-3 me-2" href="javascript:history.back()">[[#{error.back}]]</a>
    <a class="btn btn-amber mt-3" href="/">[[#{ui.ve_trang_chu}]]</a>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::section}, ~{::scripts})}">
<head><title>Soát vé · BBCinema</title></head>
<body>
<section class="p-4" style="max-width: 760px">
    <h1 class="h4">Soát vé</h1>
    <p class="text-muted small">Nhập mã đặt vé (in trên vé hoặc trong mã QR). Cổng soát mở trước giờ chiếu 60 phút.</p>
    <form class="d-flex gap-2 mb-4" method="get" action="/staff/checkin">
        <input class="form-control form-control-lg text-uppercase font-monospace" name="code" th:value="${code}" placeholder="VD: K7M2QX9P" aria-label="Mã vé" autofocus required>
        <button class="btn btn-navy btn-lg" type="submit">Tra cứu</button>
    </form>
    <div class="alert alert-danger" th:if="${lookupError != null}" th:text="${lookupError}">Lỗi</div>
    <div class="panel" th:if="${booking != null}">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <div class="code" th:text="${booking.code}">CODE</div>
                <div class="h5 mb-1" th:text="${booking.showtime.movie.title}">Phim</div>
                <div th:text="${booking.showtime.room.cinema.name} + ' · ' + ${booking.showtime.room.name} + ' · ' + ${#temporals.format(booking.showtime.startTime, 'HH:mm dd/MM/yyyy')}">Suất</div>
                <div>Ghế: <strong th:text="${booking.seatLabels}">A1</strong> · Khách: <strong th:text="${booking.displayName}">Tên</strong></div>
                <div class="small" th:each="c : ${booking.combos}" th:text="${c.quantity} + ' × ' + ${c.combo.name}">Combo</div>
            </div>
            <span class="status-pill" th:classappend="'status-' + ${booking.status.name()}" th:text="${booking.status.label}">Đã thanh toán</span>
        </div>
        <div class="alert alert-success mt-3 mb-0" th:if="${booking.checkedInAt != null}"
             th:text="'Đã soát vé lúc ' + ${#temporals.format(booking.checkedInAt, 'HH:mm dd/MM/yyyy')}">Đã soát</div>
        <form method="post" action="/staff/checkin" class="mt-3" th:if="${booking.paid and booking.checkedInAt == null}">
            <input type="hidden" name="code" th:value="${booking.code}">
            <button class="btn btn-amber btn-lg" type="submit"><i class="bi bi-check2-circle"></i> Xác nhận vào phòng</button>
        </form>
    </div>
</section>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

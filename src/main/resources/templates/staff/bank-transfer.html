<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::section}, ~{::scripts})}">
<head><title>Chuyển khoản QR · BBCinema</title></head>
<body>
<section class="p-4">
    <a th:href="@{/staff/sell/{id}(id=${booking.showtime.id})}" class="small"><i class="bi bi-arrow-left"></i> Quay lại bán vé</a>
    <h1 class="h4 mt-2">Khách quét mã để chuyển khoản</h1>
    <p class="text-muted small mb-3">
        Đơn <strong th:text="${booking.code}">CODE</strong> ·
        <span th:text="${booking.showtime.movie.title}">Phim</span> ·
        ghế <strong th:text="${booking.seatLabels}">A1</strong>
    </p>

    <div class="alert alert-secondary" th:unless="${booking.pending}">
        Đơn này <strong th:text="${booking.status.label}">đã huỷ</strong>, không thể thanh toán nữa.
        <a th:href="@{/staff/sell/{id}(id=${booking.showtime.id})}">Bán lại</a>
    </div>

    <!-- Polls the booking status and opens the printable ticket as soon as it is paid. -->
    <div class="panel" th:if="${booking.pending}"
         th:attr="data-status-url=@{/staff/bank-transfer/{c}/status(c=${booking.code})},data-ticket-url=@{/staff/tickets/{c}(c=${booking.code})}">
        <div class="row g-4 align-items-center">
            <div class="col-md-5 text-center">
                <img class="img-fluid border rounded-3 p-2 bg-white" style="max-width: 320px"
                     th:src="@{/staff/bank-transfer/{c}/qr.png(c=${booking.code})}" alt="Mã VietQR chuyển khoản">
            </div>
            <div class="col-md-7">
                <dl class="row mb-0">
                    <dt class="col-5">Ngân hàng</dt><dd class="col-7" th:text="${transfer.bankCode}">MB</dd>
                    <dt class="col-5">Số tài khoản</dt><dd class="col-7 font-monospace" th:text="${transfer.accountNo}">0123</dd>
                    <dt class="col-5">Chủ tài khoản</dt><dd class="col-7" th:text="${transfer.accountName}">BBCINEMA</dd>
                    <dt class="col-5">Số tiền</dt><dd class="col-7 fw-bold fs-4" th:text="${@fmt.money(transfer.amount)}">0đ</dd>
                    <dt class="col-5">Nội dung</dt><dd class="col-7 fw-bold font-monospace" th:text="${transfer.message}">BBC CODE</dd>
                    <dt class="col-5">Giữ ghế đến</dt>
                    <dd class="col-7"><span class="countdown" th:attr="data-expires-at=${booking.expiresAtEpochMillis}">05:00</span></dd>
                </dl>
                <div class="d-flex align-items-center gap-2 mt-3" role="status" aria-live="polite">
                    <span class="spinner-border spinner-border-sm text-warning" aria-hidden="true"></span>
                    <span th:text="${automatic} ? 'Đang chờ ngân hàng báo tiền về (SePay)…' : 'Kiểm tra app ngân hàng của rạp rồi bấm Đã nhận tiền.'">Đang chờ</span>
                </div>
                <div class="d-flex flex-wrap gap-2 mt-3">
                    <form method="post" th:action="@{/staff/bank-transfer/{c}/confirm(c=${booking.code})}">
                        <button class="btn btn-amber" type="submit"
                                onclick="return confirm('Bạn đã thấy tiền về tài khoản của rạp?')"><i class="bi bi-check2-circle"></i> Đã nhận tiền</button>
                    </form>
                    <form method="post" th:if="${demoConfirm}" th:action="@{/staff/bank-transfer/{c}/demo-confirm(c=${booking.code})}">
                        <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-bank"></i> Giả lập ngân hàng báo có</button>
                    </form>
                    <form method="post" th:action="@{/staff/bank-transfer/{c}/cancel(c=${booking.code})}">
                        <button class="btn btn-outline-danger" type="submit"><i class="bi bi-x-circle"></i> Huỷ đơn</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
<th:block th:fragment="scripts"><script src="/js/countdown.js"></script><script src="/js/bank-transfer.js"></script></th:block>
</body>
</html>

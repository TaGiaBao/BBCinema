<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::section}, ~{::scripts})}">
<head><title th:text="'Vé ' + ${booking.code}">Vé</title></head>
<body>
<section class="p-4">
    <div class="ticket mx-auto" style="max-width: 420px">
        <div class="ticket-head text-center">
            <div class="fw-bold"><span class="text-warning">BB</span>Cinema</div>
            <div class="small opacity-75" th:text="${booking.showtime.room.cinema.name}">Rạp</div>
        </div>
        <div class="ticket-body text-center ticket-watermarked">
            <img class="ticket-watermark" src="/images/logo-watermark.svg" alt="" aria-hidden="true">
            <div class="h5" th:text="${booking.showtime.movie.title}">Phim</div>
            <div th:text="${booking.showtime.room.name} + ' · ' + ${booking.showtime.versionLabel}">P1</div>
            <div class="fs-4 fw-bold" th:text="${#temporals.format(booking.showtime.startTime, 'HH:mm dd/MM/yyyy')}">19:00</div>
            <div class="mt-2">Ghế: <strong class="fs-5" th:text="${booking.seatLabels}">A1</strong></div>
            <div class="small" th:each="c : ${booking.combos}" th:text="${c.quantity} + ' × ' + ${c.combo.name}">Combo</div>
            <hr>
            <th:block th:if="${booking.user != null}">
                <div class="summary-row small" data-role="ticket-member"><span>Thành viên</span>
                    <span th:text="${booking.user.fullName} + (${booking.user.memberCode != null} ? ' · ' + ${booking.user.memberCode} : '')">Tên · BB...</span></div>
                <div class="summary-row small" th:if="${booking.tierDiscount.signum() > 0}" data-role="ticket-tier-discount">
                    <span th:text="'Giảm hạng ' + ${booking.memberTier != null ? booking.memberTier.label : ''}">Giảm hạng Bạc</span>
                    <span class="tabular" th:text="'-' + ${@fmt.money(booking.tierDiscount)}">-0đ</span></div>
            </th:block>
            <div class="summary-row"><span>Tổng tiền</span><strong th:text="${@fmt.money(booking.totalAmount)}">0đ</strong></div>
            <th:block th:if="${payment != null}">
                <div class="summary-row small"><span>Thanh toán</span><span th:text="${payment.method.label}">Tiền mặt</span></div>
                <th:block th:if="${payment.amountReceived != null}">
                    <div class="summary-row small"><span th:text="${payment.method.name() == 'CASH'} ? 'Khách đưa' : 'Số tiền POS'">Khách đưa</span>
                        <span class="tabular" th:text="${@fmt.money(payment.amountReceived)}">0đ</span></div>
                    <div class="summary-row small" th:if="${payment.method.name() == 'CASH'}"><span>Tiền thừa trả khách</span>
                        <strong class="tabular" th:text="${@fmt.money(payment.changeAmount)}">0đ</strong></div>
                </th:block>
                <div class="summary-row small" th:if="${payment.method.name() == 'CARD' and payment.gatewayTransactionNo != null}">
                    <span>Mã chuẩn chi</span><span th:text="${payment.gatewayTransactionNo}">-</span></div>
            </th:block>
            <div class="code mt-2" th:text="${booking.code}">CODE</div>
            <img th:src="@{/booking/{code}/qr.png(code=${booking.code})}" alt="QR" style="width: 160px">
            <div class="small text-muted" th:if="${booking.paidAt != null}"
                 th:text="${booking.channel.name() == 'COUNTER'}
                     ? ('Bán lúc ' + ${#temporals.format(booking.paidAt, 'HH:mm dd/MM/yyyy')} + ' · ' + ${booking.channel.label})
                     : ('Thanh toán online lúc ' + ${#temporals.format(booking.paidAt, 'HH:mm dd/MM/yyyy')})">-</div>
        </div>
    </div>
    <div class="alert alert-warning text-center mx-auto mt-3 no-print" style="max-width: 420px" th:unless="${booking.paid}"
         th:text="'Đơn ' + ${booking.status.label.toLowerCase()} + ', không in vé được'">Đơn chưa thanh toán</div>
    <div class="text-center small text-muted mt-3 no-print" data-role="print-log" th:classappend="${booking.printCount == 0} ? 'd-none'"
         th:text="${booking.printCount > 0} ? ('Đã in ' + ${booking.printCount} + ' lần · lần cuối ' + ${#temporals.format(booking.lastPrintedAt, 'HH:mm dd/MM/yyyy')}) : ''"></div>
    <div class="text-center small text-danger mt-2 no-print d-none" data-role="print-warning" role="alert"></div>
    <div class="text-center mt-3 no-print d-flex flex-wrap gap-2 justify-content-center">
        <a class="btn btn-outline-navy" th:if="${fromCheckin}" data-role="back-to-checkin"
           th:href="@{/staff/checkin(code=${booking.code})}"><i class="bi bi-arrow-left"></i> Quay lại soát vé</a>
        <button class="btn btn-navy" type="button" th:if="${booking.paid}" data-role="print-ticket"
                th:attr="data-print-url=@{/staff/tickets/{c}/printed(c=${booking.code})}"><i class="bi bi-printer"></i> In vé</button>
        <a class="btn btn-outline-navy" th:href="@{/staff/sell/{id}(id=${booking.showtime.id})}">Bán tiếp suất này</a>
        <a class="btn btn-outline-secondary" href="/staff">Danh sách suất</a>
    </div>
</section>
<th:block th:fragment="scripts">
    <script src="/js/ticket-print.js"></script>
</th:block>
</body>
</html>

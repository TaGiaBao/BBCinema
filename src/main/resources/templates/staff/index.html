<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/admin :: layout(~{::title}, ~{::section}, ~{::scripts})}">
<head><title>Bán vé tại quầy · BBCinema</title></head>
<body>
<section class="p-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h4 mb-0">Bán vé tại quầy · <span th:text="${currentCinema != null ? currentCinema.name : ''}">Rạp</span></h1>
        <form class="d-flex gap-2" method="get" action="/staff/checkin">
            <input class="form-control text-uppercase" name="code" placeholder="Mã vé cần soát" aria-label="Mã vé">
            <button class="btn btn-navy" type="submit"><i class="bi bi-qr-code-scan"></i> Soát vé</button>
        </form>
    </div>
    <!-- Running totals of the open till shift; the manager counts the drawer against them at closing. -->
    <div class="panel mb-3" th:if="${shiftSummary != null}" th:with="s=${shiftSummary}">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h6 mb-0"><i class="bi bi-cash-stack"></i> Ca hiện tại
                <span class="small text-muted fw-normal" th:text="'· vào ca ' + ${#temporals.format(s.shift.openedAt, 'HH:mm')}
                      + ' · quỹ đầu ca ' + ${@fmt.money(s.shift.openingFloat)}">· vào ca 08:00</span></h2>
            <a class="btn btn-sm btn-outline-navy" href="/staff/shift/close">Kết ca</a>
        </div>
        <div class="row g-3 small">
            <div class="col-md-5">
                <div class="fw-semibold mb-1" th:text="'Tiền mặt · ' + ${s.cashSales} + ' đơn'">Tiền mặt</div>
                <div class="summary-row"><span>Khách đưa</span><span class="tabular" th:text="${@fmt.money(s.cashReceived)}">0đ</span></div>
                <div class="summary-row"><span>Đã trả lại khách</span><span class="tabular" th:text="'− ' + ${@fmt.money(s.changeGiven)}">0đ</span></div>
                <div class="summary-row" th:if="${s.cashRefunds > 0}"><span th:text="'Hoàn tiền huỷ vé (' + ${s.cashRefunds} + ')'">Hoàn tiền</span>
                    <span class="tabular" th:text="'− ' + ${@fmt.money(s.cashRefunded)}">0đ</span></div>
                <div class="summary-row"><span>Tiền mặt thu trong ca</span><strong class="tabular" th:text="${@fmt.money(s.netCash())}">0đ</strong></div>
                <div class="summary-row"><span>Tiền mặt phải có trong két</span><strong class="tabular" th:text="${@fmt.money(s.expectedCash())}">0đ</strong></div>
            </div>
            <div class="col-md-3">
                <div class="fw-semibold mb-1" th:text="'Thẻ (POS) · ' + ${s.cardSales} + ' đơn'">Thẻ</div>
                <div class="summary-row"><span>Tổng</span><strong class="tabular" th:text="${@fmt.money(s.cardTotal)}">0đ</strong></div>
            </div>
            <div class="col-md-4">
                <div class="fw-semibold mb-1" th:text="'Chuyển khoản QR · ' + ${s.transferSales} + ' đơn'">QR</div>
                <div class="summary-row"><span>Tổng</span><strong class="tabular" th:text="${@fmt.money(s.transferTotal)}">0đ</strong></div>
            </div>
        </div>
    </div>
    <div class="date-strip mb-4">
        <a th:each="d : ${dates}" th:href="@{/staff(date=${d})}" th:classappend="${d == selectedDate} ? 'active'">
            <span class="day" th:text="${#temporals.format(d, 'dd')}">01</span>
            <span class="dow" th:text="${@fmt.relativeDay(d, today)}">Hôm nay</span>
        </a>
    </div>
    <p class="text-muted" th:if="${#lists.isEmpty(schedule)}">Không có suất chiếu.</p>
    <div class="d-grid gap-3">
        <div class="panel" th:each="item : ${schedule}">
            <div class="d-flex align-items-center gap-2 mb-2">
                <span class="age-badge" th:classappend="${item.movie.ageRating.name()}" th:text="${item.movie.ageRating.name()}">P</span>
                <strong th:text="${item.movie.title}">Phim</strong>
                <span class="small text-muted" th:text="${item.movie.durationMinutes} + ' phút'">120</span>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <a th:each="s : ${item.showtimes}" class="time-btn" th:href="@{/staff/sell/{id}(id=${s.id})}">
                    <span th:text="${#temporals.format(s.startTime, 'HH:mm')}">19:00</span>
                    <small th:text="${s.versionLabel} + ' · ' + ${s.room.name}">2D</small>
                </a>
            </div>
        </div>
    </div>
</section>
<th:block th:fragment="scripts"></th:block>
</body>
</html>

bankqr.qrAlt=Mã VietQR chuyển khoản cho đơn này
bankqr.bank=Ngân hàng
bankqr.account=Số tài khoản
bankqr.holder=Chủ tài khoản
bankqr.amount=Số tiền
bankqr.message=Nội dung
bankqr.keepMessage=Giữ nguyên nội dung chuyển khoản để hệ thống nhận ra đơn của bạn. Chuyển đủ số tiền trước khi hết thời gian giữ ghế.
bankqr.waitingAuto=Đang chờ ngân hàng báo tiền về… Trang sẽ tự chuyển sang vé khi thanh toán xong.
bankqr.waitingManual=Đang chờ rạp xác nhận đã nhận tiền… Trang sẽ tự chuyển sang vé khi xong.
bankqr.demoButton=Giả lập ngân hàng báo có
bankqr.demoNote=Chỉ có ở bản demo, thay cho việc chuyển tiền thật.

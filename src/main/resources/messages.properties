verify.title=Kiểm tra email của bạn
verify.sentTo=Chúng tôi đã gửi đường dẫn xác nhận tới
verify.howto=Bấm đường dẫn trong email để kích hoạt tài khoản rồi đăng nhập. Vé xem phim có mã QR sẽ được gửi về địa chỉ này. Đường dẫn có hạn 24 giờ.
verify.resend=Gửi lại email xác nhận
verify.resent=Nếu địa chỉ này có tài khoản chưa xác nhận, một email mới vừa được gửi.
verify.spam=Không thấy email? Hãy xem thư mục Spam hoặc Quảng cáo.
register.verifyNote=Chúng tôi sẽ gửi đường dẫn xác nhận tới email này. Vé có mã QR cũng được gửi về đây.
holiday.badge=Ngày lễ
holiday.priceNote=Suất chiếu bắt đầu vào ngày lễ áp dụng giá ngày lễ (kể cả khi ngày lễ rơi vào thứ 7, chủ nhật). Nếu rạp chưa đặt giá ngày lễ cho một loại ghế thì áp dụng giá cuối tuần.
holiday.upcomingTitle=Ngày lễ sắp tới
holiday.none=Chưa có ngày lễ nào trong 12 tháng tới.

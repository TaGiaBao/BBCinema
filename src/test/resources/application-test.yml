spring:
  datasource:
    url: jdbc:h2:mem:bbcinema-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  seed-data: false
  # The developer's .env may turn real mail on; tests must never send e-mails.
  mail:
    enabled: false
  demo-mailbox: false
  # Payment settings from the developer's .env must not leak into tests either; tests that need them set their own.
  vnpay:
    tmn-code: ""
    hash-secret: ""
  google:
    client-id: ""
    client-secret: ""
  bank-qr:
    bank-code: ""
    bank-bin: ""
    account-no: ""
    account-name: ""
    sepay-api-token: ""
    demo-confirm: false
  upload:
    dir: target/test-uploads
  booking:
    expire-job-interval-ms: 3600000
  # Tests give birthday codes by calling BirthdayRewardService directly.
  birthday-reward:
    cron: "-"
    run-at-startup: false
logging:
  level:
    com.bbcinema: WARN
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR
